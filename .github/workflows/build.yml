# SPDX-License-Identifier: GPL-2.0-or-later
#
# Builds knobs, runs every test against a real OBS Studio, and packages the
# installer and the portable zip. CI and Release call it.
name: Build

on:
  workflow_call:

permissions:
  contents: read

env:
  # The OBS versions the tests load libobs from (src/runtime/obs_version.h):
  # the newest tested one, installed as users have it, and the oldest
  # supported one, unzipped.
  OBS_VERSION: 33.0.0-rc1
  OBS_INSTALLER_SHA256: 89cda9af39aaa0c6bbdae4d5db3bbfed127c82a6ef57b79acc6a745a872fa85c
  OBS_OLDEST_VERSION: 32.2.2
  OBS_OLDEST_ZIP_SHA256: 4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1
  INNO_SETUP_VERSION: 6.7.1

jobs:
  build:
    name: Build, test and package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Find the app's name
        # KNOBS_DISPLAY_NAME (src/app_info.h): the tray app's file name, and
        # its folders' names.
        id: app
        run: |
          $name = [regex]::Match((Get-Content -Raw src/app_info.h), '#define KNOBS_DISPLAY_NAME "([^"]+)"').Groups[1].Value
          if (-not $name) { throw "There's no KNOBS_DISPLAY_NAME in src/app_info.h." }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake --preset x64

      - name: Build
        run: cmake --build --preset release

      - name: Install OBS Studio
        # The smoke, harness, import and core tests load libobs from it. None of
        # them opens an audio device, and the runner has none.
        run: |
          $installer = "$env:RUNNER_TEMP\obs-setup.exe"
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64-Installer.exe"
          Invoke-WebRequest $url -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:OBS_INSTALLER_SHA256) { throw "OBS's installer has an unexpected checksum: $hash" }
          Start-Process $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path "$env:ProgramFiles\obs-studio\bin\64bit\obs.dll")) { throw "OBS didn't install." }

      - name: Test
        # With OBS installed, a skipped test is a failure.
        run: |
          ctest --preset release 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($log -match 'Skipped') { throw 'A test skipped although OBS is installed.' }

      - name: Test against the oldest supported OBS
        # The tests that need OBS again, pointed at an unzipped OBS
        # (KNOBS_TEST_OBS_DIR). Configuring again changes only the tests.
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          $zip = "$env:RUNNER_TEMP\obs-oldest.zip"
          $dir = "$env:RUNNER_TEMP\obs-$env:OBS_OLDEST_VERSION"
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_OLDEST_VERSION/OBS-Studio-$env:OBS_OLDEST_VERSION-Windows-x64.zip"
          Invoke-WebRequest $url -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $env:OBS_OLDEST_ZIP_SHA256) { throw "OBS's zip has an unexpected checksum: $hash" }
          Expand-Archive $zip -DestinationPath $dir
          if (-not (Test-Path "$dir\bin\64bit\obs.dll")) { throw "OBS's zip has no bin\64bit\obs.dll." }
          cmake --preset x64 "-DKNOBS_TEST_OBS_DIR=$dir"
          ctest --preset release --exclude-regex '^unit$' 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($log -match 'Skipped') { throw 'A test skipped although OBS is there.' }
          # The tests copy the OBS they load into a folder named for its version.
          if (-not (Test-Path "$env:LOCALAPPDATA\$env:APP_NAME\runtime\$env:OBS_OLDEST_VERSION\bin\64bit\obs.dll")) {
            throw "The tests didn't load OBS $env:OBS_OLDEST_VERSION."
          }

      - name: Install Inno Setup
        run: choco install innosetup --version $env:INNO_SETUP_VERSION --yes --no-progress

      - name: Package
        run: ./packaging/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/package/
          if-no-files-found: error

      # The tested exe, for Release to sign and package.
      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: build/x64/Release/${{ steps.app.outputs.name }}.exe
          retention-days: 7
          if-no-files-found: error
